---
# Env-specific vars ONLY — shared vars live in the root group_vars/all/vars.yml.
env_name: production

# Production public domain served by Caddy (the role default is only a placeholder).
caddy_domain: "lucasboillot.fr"

# V1 single-VPS: this env is the real prod, so use Let's Encrypt PROD ACME for
# browser-trusted certs. The role default stays staging (rate-limit safety net).
caddy_acme_staging: false

# The apex lucasboillot.fr resolves to another host (145.239.37.162), not this VPS, so the
# clients dial the VPS directly. A `vpn.lucasboillot.fr` A record pointing at THIS PUBLIC
# IP would replace it — the point being that a name survives a change of IP, where this
# literal is baked into all seven client profiles. Re-run `make vpn-profiles` after any
# change here. Never point that record at 10.8.0.1: clients resolve it before the tunnel
# exists.
openvpn_remote_host: "51.255.169.129"

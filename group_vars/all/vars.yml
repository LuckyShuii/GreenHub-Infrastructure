---
# Non-secret vars shared by ALL environments.
# This layer (playbook-level group_vars/all) OUTRANKS inventory group_vars/all, so keep
# ONLY shared keys here — anything an env must override belongs in inventories/<env>/.

common_timezone: "Europe/Paris"

# Image bootstrap account, not a users.yml account (exists before Ansible, unmanaged).
# To migrate to a nominative admin account later.
ansible_user: ubuntu

# Vault indirection: real values live per-env in inventories/<env>/.../vault.yml as vault_*.
db_password: "{{ vault_db_password }}"
grafana_admin_password: "{{ vault_grafana_admin_password }}"
backup_restic_password: "{{ vault_backup_restic_password }}"

dockerhub_pull_user: "{{ vault_dockerhub_pull_user }}"
dockerhub_pull_token: "{{ vault_dockerhub_pull_token }}"

# CD contract with the CI. The pipeline POSTs the commit SHA that tags the image it just
# published, authenticated by this token (the CI knows it as the VPS_DEPLOY_KEY repo
# secret). Both the webhook trigger rule and the deploy playbook check the SHA against the
# pattern, so a malformed payload is refused before anything runs.
deploy_webhook_token: "{{ vault_deploy_webhook_token }}"
deploy_version_pattern: "^[0-9a-f]{7,40}$"

# AI service: names/values mirror the ai-service repo (.env.example + configs.py).
# The old AI_PIPELINE_MODEL_NAME (image-classification pipeline) is gone: the service now
# embeds images and searches a Qdrant vector store.
ai_embedding_model: "facebook/dinov2-small"
ai_host: "0.0.0.0"
ai_port: 8443
ai_device: "cpu"
# Relative to the image WORKDIR (/greener); the region JSON files ship in the image.
ai_data_dir: "./data"
# Downloaded reference images are never re-read by the code, only written: off in prod.
ai_save_images: false
ai_log_level: "INFO"

# Qdrant vector store, internal to the compose stack (service name = hostname).
qdrant_host: "qdrant"
qdrant_port: 6333

---
# Non-secret vars shared by ALL environments.
# This layer (playbook-level group_vars/all) OUTRANKS inventory group_vars/all, so keep
# ONLY shared keys here — anything an env must override belongs in inventories/<env>/.

common_timezone: "Europe/Paris"

# No ansible_user on purpose: with remote_user unset Ansible lets the SSH client pick the
# account, so each operator connects with their own nominative users.yml account via their
# ~/.ssh/config and sudo stays traceable per person. Fresh VPS, before `common` has created
# the accounts, fall back to the image's unmanaged bootstrap account: make deploy BOOTSTRAP=1

# Vault indirection: real values live per-env in inventories/<env>/.../vault.yml as vault_*.
db_password: "{{ vault_db_password }}"
grafana_admin_password: "{{ vault_grafana_admin_password }}"
backup_restic_password: "{{ vault_backup_restic_password }}"
grafana_user_passwords: "{{ vault_grafana_user_passwords }}"
# Anyone holding this URL can post in the alert channel, so it is a secret like the
# rest: encrypted per env, rendered only into the 0600 Grafana env file.
discord_alert_webhook: "{{ vault_discord_alert_webhook }}"

dockerhub_pull_user: "{{ vault_dockerhub_pull_user }}"
dockerhub_pull_token: "{{ vault_dockerhub_pull_token }}"

# CD contract with the CI. The pipeline POSTs the tag of the image it just published,
# authenticated by this token (the CI knows it as the VPS_DEPLOY_KEY repo secret). Both the
# webhook trigger rule and the deploy playbook check the version against the pattern, so a
# malformed payload is refused before anything runs.
#
# DECISION (LBT, 2026-09-21): `latest` is accepted alongside a commit SHA, so the pipeline
# can deploy without forwarding the SHA it built. ACCEPTED COST: deployed-versions.yml then
# records `latest` rather than a commit, so the VPS can no longer answer "what is running
# here"; rollback has no immutable tag to return to; and a build finishing in between can
# move the tag under a pull. Drop the alternative once the CI sends its SHA.
deploy_webhook_token: "{{ vault_deploy_webhook_token }}"
deploy_version_pattern: "^([0-9a-f]{7,40}|latest)$"

# Observability. The Grafana container binds the loopback only; this toggle decides whether
# Caddy ALSO publishes it at grafana.<caddy_domain>.
#
# DECISION (LBT, 2026-09-17, SCRUM-133): it stays ON until OpenVPN is configured
# (SCRUM-58). Requiring an SSH tunnel from seven people for every look at a dashboard is
# not workable during development, so this exposure is an ACCEPTED risk, not an oversight.
# The compensating controls are listed in roles/monitoring/README.md. The residual risk
# none of them covers is a Grafana CVE reachable from the internet — only the network
# restriction fixes that.
#
# Condition to lift: SCRUM-58 (VPN). Binding Grafana to the VPN address and deleting this
# variable is part of that ticket — SCRUM-129 was narrowed to the log sources and closed.
# While on, it needs a DNS record for grafana.<caddy_domain>.
# Shared here because caddy (the vhost) and monitoring (root URL + hardening) both need the
# same answer.
grafana_public: true

# AI service: names/values mirror the ai-service repo (.env.example + configs.py).
# The old AI_PIPELINE_MODEL_NAME (image-classification pipeline) is gone: the service now
# embeds images and searches a Qdrant vector store.
ai_embedding_model: "facebook/dinov2-small"
ai_host: "0.0.0.0"
ai_port: 8443
ai_device: "cpu"
# Relative to the image WORKDIR (/greener); the region JSON files ship in the image.
ai_data_dir: "./data"
# Downloaded reference images are never re-read by the code, only written: off in prod.
ai_save_images: false
ai_log_level: "INFO"

# Qdrant vector store, internal to the compose stack (service name = hostname).
qdrant_host: "qdrant"
qdrant_port: 6333

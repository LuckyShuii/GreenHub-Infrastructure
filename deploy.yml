---
# Recurring deploy, run LOCALLY ON THE VPS by the webhook daemon, as the deploy account —
# never a push run from a workstation. Provisioning stays site.yml; this playbook only
# rolls ONE service onto a new image tag, and it reuses the app_stack role so the compose
# file keeps a single renderer.
#
#   ansible-playbook deploy.yml -e deploy_service=backend -e deploy_version=<sha>

- name: Deploy one application service
  hosts: greener_vps
  # The deploy account has no sudo: it owns the stack directory and reaches docker through
  # its group. This overrides the become=True that provisioning runs rely on.
  become: false
  gather_facts: false
  vars:
    app_stack_enabled: true
    # Block until the service is running and healthy, so a broken image fails the run
    # instead of returning green. The provisioning run leaves this off (a cold AI start
    # indexes for a long while before it serves).
    app_stack_wait: true
    app_stack_services: ["{{ deploy_service }}"]
    # Only the targeted service is pinned; an empty override makes app_stack keep the tag
    # the other service is recorded as running, instead of resetting it to the bootstrap
    # default.
    app_stack_backend_version: "{{ deploy_version if deploy_service == 'backend' else '' }}"
    app_stack_ai_version: "{{ deploy_version if deploy_service == 'ai' else '' }}"

  pre_tasks:
    # The daemon already rejects a malformed request with a 403, but the playbook must not
    # depend on who called it.
    - name: Validate the deploy request
      ansible.builtin.assert:
        that:
          - deploy_service is defined
          - deploy_service in app_stack_deployable_services
          - deploy_version is defined
          - deploy_version is match(deploy_version_pattern)
        fail_msg: >-
          deploy_service must be one of {{ app_stack_deployable_services | join(', ') }}
          and deploy_version a commit SHA or `latest`.
        quiet: true

  roles:
    # Re-rendered first so an env var added to the vault reaches the containers with the
    # same deploy, without waiting for a provisioning run.
    - role: backend
      tags: [backend]
    - role: app_stack
      tags: [app_stack]

  post_tasks:
    # A deploy marker on every dashboard. The first question of every incident is "did this
    # start after a deploy?", and answering it by cross-reading two tools is exactly the
    # kind of friction that makes people not answer it at all.
    #
    # Posted from the playbook rather than derived from container start times, because only
    # the playbook knows WHICH VERSION went out — that is the whole value of the marker.
    #
    # THREE guards, all deliberate, all saying the same thing: an annotation must never
    # break a deployment. No token -> skipped. Grafana down or slow -> failed_when: false.
    # changed_when: false -> a successful deploy does not report a change for a graph note.
    - name: Annotate the deployment in Grafana
      ansible.builtin.uri:
        url: "{{ grafana_annotation_api }}"
        method: POST
        headers:
          Authorization: "Bearer {{ grafana_annotation_token }}"
        body_format: json
        body:
          tags: ["deploy", "{{ deploy_service }}"]
          text: "Déploiement {{ deploy_service }} — {{ deploy_version }}"
        status_code: 200
        timeout: 10
      register: deploy_annotation
      failed_when: false
      changed_when: false
      no_log: "{{ hide_secrets | default(true) }}"
      when: grafana_annotation_token | default('') | length > 0

    # Reported, not raised. Silence would hide a token that expired months ago, and the
    # only symptom would be dashboards that quietly stopped showing deploys.
    - name: Report a failed deploy annotation
      ansible.builtin.debug:
        msg: >-
          Grafana refused the deploy annotation (HTTP
          {{ deploy_annotation.status | default('n/a') }}). The deployment itself is
          unaffected; check the service-account token in vault_grafana_annotation_token.
      when:
        - grafana_annotation_token | default('') | length > 0
        - deploy_annotation.status | default(0) != 200

---
# Disk upkeep: the two things that filled this host are untagged images left by each
# deploy, and a build cache nothing reads.

- name: Install the prune script
  ansible.builtin.copy:
    src: greener-docker-prune.sh
    dest: "{{ maintenance_script }}"
    owner: root
    group: root
    mode: "0755"
    validate: "bash -n %s"

- name: Install the prune units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: greener-docker-prune.service.j2
      dest: "{{ maintenance_unit }}.service"
    - src: greener-docker-prune.timer.j2
      dest: "{{ maintenance_unit }}.timer"
  loop_control:
    label: "{{ item.dest }}"
  notify: Reload systemd for maintenance

- name: Enable the prune timer
  ansible.builtin.systemd:
    name: "{{ maintenance_unit }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - maintenance_enabled | bool
    # A dry run never writes the unit, and systemd fails on one it cannot find.
    - not ansible_check_mode

# Nothing in this repo installs logrotate, and a minimal image does not always carry it —
# at which point the text logs under /var/log have no rotation at all. The distro's own
# rules are left exactly as they ship; only their presence is asserted.
- name: Ensure logrotate is installed
  ansible.builtin.apt:
    name: "{{ maintenance_logrotate_packages }}"
    state: present
    cache_valid_time: 3600

- name: Enable the logrotate timer
  ansible.builtin.systemd:
    name: "{{ maintenance_logrotate_timer }}"
    enabled: true
    state: started
  # Same reason as the prune timer: on a fresh host a dry run has not installed the package
  # that ships this unit, and systemd fails on a unit it cannot find.
  when: not ansible_check_mode

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: "{{ maintenance_journald_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# A drop-in rather than journald.conf itself: the distro file stays untouched and the whole
# of our policy is one readable file.
- name: Bound the system journal
  ansible.builtin.template:
    src: journald.conf.j2
    dest: "{{ maintenance_journald_dropin_dir }}/{{ maintenance_journald_dropin }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

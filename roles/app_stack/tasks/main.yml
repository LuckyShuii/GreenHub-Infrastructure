---
# Requires the docker role (engine + compose + SDK) and backend role (.env) to run first.

# An empty version renders "<repo>:backend-" and docker answers the misleading
# "repository does not exist", so catch it here instead.
- name: Assert the image versions are set
  ansible.builtin.assert:
    that:
      - app_stack_backend_version | default('', true) | length > 0
      - app_stack_ai_version | default('', true) | length > 0
    fail_msg: >-
      app_stack_backend_version and app_stack_ai_version must be non-empty image tags,
      got '{{ app_stack_backend_version }}' and '{{ app_stack_ai_version }}'.
      Pass a published tag, e.g. -e app_stack_backend_version=<sha>.
    quiet: true

- name: Ensure stack directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ app_stack_dir }}"
    - "{{ app_stack_gateway_dir }}"
    - "{{ app_stack_postgres_init_dir }}"

- name: Deploy the internal gateway config template
  ansible.builtin.copy:
    src: gateway/default.conf.template
    dest: "{{ app_stack_gateway_dir }}/default.conf.template"
    owner: root
    group: root
    mode: "0644"
  notify: restart gateway

- name: Deploy the postgres init scripts
  ansible.builtin.copy:
    src: postgres-init/
    dest: "{{ app_stack_postgres_init_dir }}/"
    owner: root
    group: root
    mode: "0644"

- name: Render the compose file
  ansible.builtin.template:
    src: docker-compose.prod.yml.j2
    dest: "{{ app_stack_compose_file }}"
    owner: root
    group: root
    mode: "0644"

# The compose command runs as the connection user (root, via the global become), so the
# registry credentials must be in ROOT's docker config. The docker role logs in as the
# `deploy` account instead — that one is for the CD webhook and does not help here.
- name: Log in to the image registry
  community.docker.docker_login:
    username: "{{ dockerhub_pull_user }}"
    password: "{{ dockerhub_pull_token }}"
  no_log: "{{ hide_secrets | default(true) }}"
  when: app_stack_enabled | bool

- name: Pull images and (re)start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_stack_dir }}"
    files:
      - docker-compose.yml
    services: "{{ app_stack_services | default([], true) }}"
    pull: always
    state: present
  when: app_stack_enabled | bool

---
# Off by default so a deploy never pulls images CI has not published yet.
app_stack_enabled: false

# Compose services to bring up; empty = all of them. Lets a bring-up skip a service whose
# image is not published yet, and gives the CD webhook its per-service redeploy.
# Compose also starts the depends_on of whatever is listed.
app_stack_services: []

# Artifacts belong to the non-human CD account so the recurring deploy (deploy.yml, run
# locally as `deploy`) re-renders them without root. Modes stay world-readable: the bind
# mounts are read by container uids, not by `deploy`.
app_stack_owner: deploy
app_stack_group: deploy

app_stack_dir: /opt/greener
app_stack_env_file: "{{ app_stack_dir }}/.env"
app_stack_gateway_dir: "{{ app_stack_dir }}/gateway"
app_stack_postgres_init_dir: "{{ app_stack_dir }}/postgres-init"
app_stack_compose_file: "{{ app_stack_dir }}/docker-compose.yml"

# Compose derives both from the project directory. Needed to tell a gateway that is running
# (its bind-mounted config must be re-read) from a host where nothing was ever brought up.
app_stack_project_name: "{{ app_stack_dir | basename }}"
app_stack_gateway_container: "{{ app_stack_project_name }}-gateway-1"

# Private repo; backend/ai differ by tag prefix and are versioned independently by commit
# SHA. These two are OVERRIDES: empty means "keep the tag this host is recorded as
# running", so rolling one service never rewrites the other's pin back to a default.
app_stack_repo: "docker.io/lucasboillot/greenhub"
app_stack_backend_version: ""
app_stack_ai_version: ""

# Records the tag each service was last deployed with — the answer to "what is running
# here", and what makes a targeted redeploy safe. Written after every successful bring-up.
app_stack_state_file: "{{ app_stack_dir }}/deployed-versions.yml"

# Used only when nothing is recorded yet and no override was given (fresh host).
app_stack_bootstrap_version: "latest"

# Resolved by the role (see tasks/main.yml); the images follow from them.
app_stack_backend_image: "{{ app_stack_repo }}:backend-{{ app_stack_backend_tag }}"
app_stack_ai_image: "{{ app_stack_repo }}:ai-{{ app_stack_ai_tag }}"

# Services the CD webhook may roll; the rest run public images and come up with the
# provisioning run.
app_stack_deployable_services: [backend, ai]

# Ce que compose démarre avec le service ciblé (depends_on) ; sert à l'annonce de déploiement.
app_stack_service_dependencies:
  backend: [postgres]
  ai: [qdrant]

app_stack_gateway_image: "nginx:1.27-alpine"
app_stack_postgres_image: "postgis/postgis:16-3.4-alpine"
# Official image, pinned to the QDRANT_VERSION of the ai-service repo — keep them in sync.
# We do not build its qdrant.dockerfile (it only adds curl for a healthcheck); the probe
# below uses bash's /dev/tcp instead, so there is no third image for CI to publish.
app_stack_qdrant_image: "qdrant/qdrant:v1.18.2"

app_stack_backend_upstream: "backend:8000"
app_stack_ai_upstream: "ai:{{ ai_port }}"

# Only the gateway is published, on loopback — Caddy reverse-proxies to it.
app_stack_gateway_publish: "127.0.0.1:8080"

app_stack_pg_data_volume: pg_data
app_stack_ai_models_volume: ai_models
# Holds the indexed vectors: without it every restart re-downloads and re-embeds the
# reference images of all 114 items (many minutes, and the API does not answer meanwhile).
app_stack_qdrant_storage_volume: qdrant_storage

# First boot indexes every region before uvicorn accepts connections, so the AI probe
# needs a long grace period (see roles/app_stack/README.md).
app_stack_ai_start_period: 20m

# `docker compose up --wait`: block until the targeted services are healthy. Off for the
# provisioning run (a cold AI start would hold it for the whole indexing); the deploy
# playbook turns it on, so a broken image fails the deploy instead of passing silently.
app_stack_wait: false
app_stack_wait_timeout: 600

# --- Memory limits -----------------------------------------------------------------------
# Added for the per-container memory alert in roles/monitoring, but the limit matters more
# than the alert. WITHOUT one, a service that leaks does not get killed — the KERNEL picks
# a victim under pressure, and on this host the victim can just as easily be Postgres as
# the process that actually misbehaved. A limit turns "the host degrades mysteriously" into
# "one container died, and we know which".
#
# It also makes the alert possible at all: greener-memory-container reads
# container_spec_memory_limit_bytes from cAdvisor and skips any container reporting 0, so a
# service with no limit here is simply not covered.
#
# READ THESE AS A FIRST CUT, NOT AS MEASUREMENTS. ~9.75 GB committed of the host's 15 GB,
# leaving room for the host itself and for the monitoring stack (Loki, Prometheus, Grafana,
# Alloy). Watch "Mémoire par service" on the GREENER — Services dashboard for a week and
# move them.
#
# THE FAILURE MODE TO KNOW: a limit set too low does not degrade, it OOM-kills. The
# container then restarts, and restarts again — which greener-restart-loop catches within
# 15 minutes. That is the intended safety net for a bad number here, not an accident.
# `ai` is the one to watch: it loads an embedding model and indexes every region at boot.
app_stack_mem_limits:
  gateway: 256m
  postgres: 2g
  backend: 1g
  qdrant: 1536m
  ai: 5g

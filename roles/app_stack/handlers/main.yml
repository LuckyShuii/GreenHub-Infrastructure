---
# Gateway config is bind-mounted, so a change needs an explicit restart to reload nginx.
- name: Restart gateway
  community.docker.docker_compose_v2:
    project_src: "{{ app_stack_dir }}"
    files:
      - docker-compose.yml
    services:
      - gateway
    state: restarted
  # Not app_stack_enabled: that flag is about pulling images, and a provisioning run that
  # rewrote this config must apply it. Skipped under --check like the monitoring handlers —
  # the config the container would re-read was never written.
  when:
    - app_stack_gateway_state.exists | default(false) | bool
    - not ansible_check_mode

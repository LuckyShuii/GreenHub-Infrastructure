---
# Docker Engine from Docker's official APT repo (never the distro's docker.io).

# APT prerequisites for fetching the key and the repo over HTTPS.
docker_apt_prereqs:
  - ca-certificates
  - curl
  - gnupg

# Docker Engine, CLI, containerd, buildx and compose plugin — all from Docker's repo.
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Official Docker GPG key (armored) and its keyring location.
docker_keyring_path: /etc/apt/keyrings/docker.asc
docker_gpg_url: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg

# Users to add to the `docker` group. Reserved for a future NON-HUMAN service account
# only — humans must use sudo, never the docker group. Keep empty by default.
docker_managed_users: []

# Needed on the target by community.docker modules.
docker_sdk_packages:
  - python3-docker

# --- Container log rotation (SCRUM-129) ---------------------------------------------------
# Docker's json-file driver rotates NOTHING by default: a container's log grows until the
# disk is full, and this host is already at 77% of 77 GB. The cap is set on the DAEMON, not
# per compose service, so it also covers containers this repo does not render (the
# monitoring stack, anything started by hand) — one place, no way to forget a service.
#
# 10 MB x 3 files = at most 30 MB of live log per container, which is roughly a day of the
# busiest one. That is the SHORT-TERM buffer, deliberately: history lives in Loki with its
# own retention, and `docker logs` is only what you read before Grafana is open.
#
# TWO THINGS TO KNOW. The daemon reads these at CONTAINER CREATION, so the reload below
# applies them to containers created afterwards — the ones running now keep their unlimited
# setting until their next recreation (any deploy does it). And this file is the whole
# daemon configuration: anything else added to dockerd's config belongs in the template, not
# in a second file.
docker_daemon_config: /etc/docker/daemon.json
docker_log_driver: json-file
docker_log_max_size: "10m"
docker_log_max_file: "3"

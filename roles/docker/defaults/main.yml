---
# Docker Engine from Docker's official APT repo (never the distro's docker.io).

# APT prerequisites for fetching the key and the repo over HTTPS.
docker_apt_prereqs:
  - ca-certificates
  - curl
  - gnupg

# Docker Engine, CLI, containerd, buildx and compose plugin — all from Docker's repo.
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Official Docker GPG key (armored) and its keyring location.
docker_keyring_path: /etc/apt/keyrings/docker.asc
docker_gpg_url: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg

# Users to add to the `docker` group. Reserved for a future NON-HUMAN service account
# only — humans must use sudo, never the docker group. Keep empty by default.
docker_managed_users: []

# Needed on the target by community.docker modules.
docker_sdk_packages:
  - python3-docker

# --- Container log rotation  ---------------------------------------------------
# Docker's json-file driver rotates NOTHING by default: a container's log grows until the
# disk is full. This daemon-wide cap covers containers this repo does not render (anything
# started by hand); the compose files pin the same values per service, because dockerd
# applies a CHANGED policy only to containers created after a daemon RESTART, and the
# handler below deliberately only reloads. See the README.
#
# 10 MB x 3 files = at most 30 MB of live log per container, roughly a day of the busiest
# one. History lives in Loki with its own retention.
#
# This file is the whole daemon configuration: anything else dockerd needs belongs in the
# template, not in a second file.
docker_daemon_config: /etc/docker/daemon.json
docker_log_driver: json-file
docker_log_max_size: "10m"
docker_log_max_file: "3"

---
# Log stack: Loki (store) + Alloy (collector) + Grafana (UI), deployed with docker compose
# in its OWN project, separate from app_stack — a monitoring change must never restart the
# application, and an application deploy must never restart the observability stack.
#
# SCRUM-129 wired the REAL sources: Alloy reads the application containers through the
# Docker API and the native services (Caddy, the CD webhook) from the systemd journal. The
# synthetic generator it replaced is off below and its teardown still runs.
# Still provisional: Grafana publishes on LOOPBACK only and Caddy re-exposes it publicly
# (grafana_public), because there is no VPN yet — that half of SCRUM-129 waits on SCRUM-58.

monitoring_enabled: true

# On-host layout. Deliberately NOT /opt/greener: a separate compose project means a
# separate directory, otherwise the two projects fight over docker-compose.yml.
monitoring_dir: /opt/greener-monitoring
monitoring_compose_file: "{{ monitoring_dir }}/docker-compose.yml"
monitoring_env_file: "{{ monitoring_dir }}/.env"
monitoring_config_dir: "{{ monitoring_dir }}/config"
monitoring_grafana_provisioning_dir: "{{ monitoring_dir }}/grafana/provisioning"
monitoring_grafana_dashboards_dir: "{{ monitoring_dir }}/grafana/dashboards"

# Root-owned: unlike app_stack, nothing here is re-rendered by the non-human CD account.
monitoring_owner: root
monitoring_group: root

# Isolated from greener_internal, and it STAYS isolated now that the real container logs
# are collected: loki.source.docker reads them through the Docker API (the daemon hands over
# the stream), not by connecting to the containers. Nothing here needs to reach them.
monitoring_network: greener_monitoring

# Pinned images — bump deliberately, never track a floating tag.
monitoring_loki_image: "grafana/loki:3.7.7"
# Alloy, not Promtail: Promtail reached end of life in March 2026 and Grafana's migration
# path is Alloy. No point standing up a collector we would have to replace immediately.
monitoring_alloy_image: "grafana/alloy:v1.19.2"
monitoring_grafana_image: "grafana/grafana:13.2.2"

monitoring_loki_port: 3100
monitoring_grafana_port: 3000
# Alloy's own UI/metrics endpoint; stays inside the compose network.
monitoring_alloy_port: 12345

# Grafana is the only service of this stack that publishes anything, and only on loopback,
# so Caddy remains the single host-facing service. Reach it with an SSH tunnel:
#   ssh -L 3000:127.0.0.1:3000 <user>@<vps>   then http://localhost:3000
monitoring_grafana_publish: "127.0.0.1:{{ monitoring_grafana_port }}"

# Public URL, used only when grafana_public is on (see group_vars/all/vars.yml). Grafana
# needs to know its external origin or its redirects and asset links point at localhost.
monitoring_grafana_root_url: "https://grafana.{{ caddy_domain }}/"

monitoring_grafana_admin_user: admin

# Session lifetime, applied only while grafana_public is on (see the compose file).
# Grafana's own default is 30 days.
monitoring_grafana_session_lifetime: "7d"

# Loki retention. Kept at 7 days now that the producers are real: the host is at 77% of a
# 77 GB disk, so this is the variable to look at first if it tightens (and the reason the
# healthcheck noise below is dropped rather than stored).
monitoring_loki_retention: "168h"

monitoring_loki_data_volume: loki_data
monitoring_grafana_data_volume: grafana_data
monitoring_alloy_data_volume: alloy_data
monitoring_prometheus_data_volume: prometheus_data

# --- Metrics (SCRUM-99) ------------------------------------------------------------------
# Prometheus is a STORE here, not a collector. The exporters (node + cAdvisor) run inside
# Alloy, which already runs as root with the host's /proc, /sys and the Docker socket — a
# separate cAdvisor container would need `privileged` to get privileges Alloy already holds.
# Alloy remote-writes the series in; Prometheus scrapes nothing but itself.
monitoring_prometheus_image: "prom/prometheus:v3.7.1"
monitoring_prometheus_port: 9090

# 15 s: fine enough to see a spike on a 4-vCPU host, coarse enough that the series stay
# small. Also copied into the Grafana datasource as timeInterval — leave the two equal, or
# Grafana proposes step values Prometheus has no points for and the graphs show gaps.
monitoring_prometheus_scrape_interval: "15s"

# 15 days of metrics against 7 of logs. Metrics are far cheaper per unit of time and are
# what you need to answer "was this slow last week too"; the disk is the limit (77% used),
# so this is the second variable to look at after the Loki retention.
monitoring_prometheus_retention: "15d"

# Where the HOST filesystem is mounted inside Alloy. The exporters must be pointed at these
# or they describe the collector instead of the machine. /sys keeps its own name because
# cAdvisor has no path-prefix option — it always reads /sys/fs/cgroup.
monitoring_host_rootfs_mount: /host/rootfs
monitoring_host_procfs_mount: /host/proc
monitoring_host_sysfs_mount: /sys

# Docker on this host runs the containerd snapshotter: `docker info` reports the `overlayfs`
# storage driver, not `overlay2`. cAdvisor then has to ask containerd itself for a
# container's filesystem layers, so it needs this socket on top of the Docker one. Alloy's
# own default for containerd_host is this very path, which is why mounting it at the same
# place inside the container needs no Alloy config at all.
monitoring_containerd_socket: /run/containerd/containerd.sock

# Queried through Grafana's datasource proxy rather than Prometheus directly: Prometheus
# publishes no host port (only Grafana does), so this is the one door in from the host.
monitoring_prometheus_query_api: >-
  http://{{ monitoring_grafana_publish
  }}/api/datasources/proxy/uid/prometheus/api/v1/query

# The queries that prove each exporter really ran. A healthy datasource only proves the
# store answers; if the exporters are misconfigured Prometheus stays happy and every panel
# is empty, which is the failure this catches. node_uname_info exists only if the node
# exporter ran; `up` for the cAdvisor job only if Alloy scraped it. Each entry must return
# at least one series or the deploy fails.
monitoring_metrics_probes:
  - node_uname_info
  - 'up{job="integrations/cadvisor"}'
  # The probe that matters, added after the first production run paged five times for
  # containers that were all running: `up` only proves Alloy SCRAPED cAdvisor, never that
  # cAdvisor managed to read a single container. Asserting one series per expected container
  # is what makes a broken exporter fail the deploy instead of firing every container-down
  # alert at once.
  - >-
    count(container_last_seen{project="{{ monitoring_app_compose_project }}"})
    >= {{ monitoring_alert_expected_containers | length }}

# --- Real log sources (SCRUM-129) --------------------------------------------------------
# Source 1: the containers of the application compose project, read over the Docker API.
#
# An ALLOW-list, and it has to be one: this host also runs containers that are nothing to do
# with GREENER, plus the monitoring stack's own three (whose logs must not be shipped into
# the Loki they describe). The value is the compose project name, which compose derives from
# the directory holding the project — app_stack_dir, i.e. /opt/greener. Hardcoded rather
# than read from app_stack: a role must not depend on another role's defaults being in
# scope. If app_stack_dir ever moves, this follows.
monitoring_app_compose_project: greener

# How often Alloy asks the daemon which containers exist. A container started between two
# refreshes has its first lines collected from the start anyway (the API replays them).
monitoring_docker_refresh_interval: "15s"

# Source 2: the systemd journal, for the services that run natively and have no container.
# An allow-list again, for a different reason: on a VPS whose SSH is still public, most of
# the journal is sshd refusing internet scans. Adding a unit here is a one-line change.
monitoring_journal_units:
  - caddy.service
  - greener-webhook.service
  - docker.service

# Mirrors webhook_service (roles/webhook/defaults). Duplicated on purpose — roles/webhook
# runs AFTER monitoring in site.yml, so its defaults are not in scope here and a
# `webhook_service | default(...)` would silently always take the default.
monitoring_webhook_service: greener-webhook

# Bounds a cold start: without it, a first run (or a run after Alloy was down) replays the
# whole persistent journal into Loki.
monitoring_journal_max_age: "12h"

# The backend probes itself every 10 s and uvicorn logs every probe — ~8 600 lines a day
# that only say "the probe ran". Dropped in the pipeline, not stored and filtered out later:
# a line nobody will ever read should cost neither index nor disk. Scoped to the loopback
# client, so a real /health call from outside is still collected.
monitoring_drop_healthcheck_logs: true

# --- Synthetic logs: replaced by the real sources above ----------------------------------
# OFF since SCRUM-129. The variables below are NOT dead: the role uses them to tear the
# generator down (timer, units, script, log directory) and, through the uid lists further
# down, to delete the alert rules that depended on it. Delete them only once that teardown
# has been applied to every environment, or a timer survives on the host with nothing left
# to manage it.
monitoring_sample_logs_enabled: false
monitoring_sample_log_dir: /var/log/greener-sample
monitoring_sample_services: [backend, ai, postgres, caddy]
monitoring_sample_levels: [debug, info, info, info, warn, error]
monitoring_sample_messages:
  - "request completed"
  - "connection pool acquired"
  - "cache miss, falling back to store"
  - "slow query detected"
  - "upstream returned a non-2xx status"
  - "scheduled task finished"
monitoring_sample_script: /usr/local/bin/greener-logsample
monitoring_sample_unit: greener-logsample
monitoring_sample_interval: "1min"
# Lines kept per file: the generator trims itself, so a throwaway source needs no logrotate.
monitoring_sample_max_lines: 2000

# docker compose --wait budget for the bring-up (seconds).
monitoring_wait_timeout: 300

# --- Grafana accounts -------------------------------------------------------------------
# Driven by group_vars/all/users.yml: an account's `grafana:` field is its org role
# (Admin | Editor | Viewer); no field means no Grafana account at all. Users are the one
# thing Grafana cannot provision from files, so the role drives its admin API instead.
monitoring_grafana_users_enabled: true
monitoring_grafana_api: "http://{{ monitoring_grafana_publish }}"
monitoring_grafana_org_id: 1
# Grafana requires an email per account and uses it as a second unique key. Nothing is ever
# sent to it (no SMTP configured), so a synthetic domain is honest: people sign in with
# their login, not their address.
monitoring_grafana_email_domain: "greener.local"
# One password per login, from the env vault (vault_grafana_user_passwords). Empty here so
# the role fails loudly on a missing entry instead of quietly sharing one password: the
# real map comes from group_vars/all/vars.yml.
grafana_user_passwords: {}
# Org roles Grafana accepts. Viewer cannot use Explore (ad-hoc log querying), which is
# exactly what a dev needs during an incident — hence Editor for the devs, not Viewer.
monitoring_grafana_roles: [Admin, Editor, Viewer]

# --- Alerting: one Discord channel ------------------------------------------------------
# Grafana Alerting routes every rule to a single Discord channel, provisioned by file like
# the datasource and the dashboards: a contact point edited in the UI does not survive a
# restart. The rules that feed it are SCRUM-131; this only builds the channel.
# Turning this off does not merely stop managing alerting, it stops the notifications:
# Grafana keeps provisioned resources in its own database, so the role renders a teardown
# that resets the root notification policy instead of just deleting the files.
monitoring_alerting_enabled: true
monitoring_alerting_dir: "{{ monitoring_grafana_provisioning_dir }}/alerting"

# Used as BOTH the receiver uid and its name: the notification policy routes by name, the
# provisioning file identifies the receiver by uid. Changing it recreates the contact point.
monitoring_alert_contact_point: greener-discord

# Full shape of a Discord webhook URL, anchored at both ends: id is numeric, token is
# URL-safe base64. Anchoring the end is what catches a truncated paste or a trailing
# newline, which a prefix-only check would wave through.
monitoring_alert_webhook_pattern: '^https://(discord|discordapp)\.com/api/webhooks/[0-9]+/[A-Za-z0-9._-]+$'

# Name of the env var Grafana reads the webhook URL from. Grafana interpolates $VAR inside
# provisioning files, so the URL stays in the 0600 .env and never lands in a 0644 file.
monitoring_alert_webhook_env: GREENER_DISCORD_ALERT_WEBHOOK

# Notification policy timings. Single VPS, one person on call: group aggressively and
# repeat rarely — a channel that cries every minute is a channel nobody reads any more.
# Base for the deep link the Discord message carries. Built here rather than from
# Grafana's runtime `.ExternalURL`, which keeps its trailing slash and yields `//d/...` —
# verified against a real notification, not assumed.
monitoring_alert_logs_link_base: >-
  {{ monitoring_grafana_root_url | regex_replace('/+$', '') }}

monitoring_alert_group_by: [alertname, env, service]
monitoring_alert_group_wait: 30s
monitoring_alert_group_interval: 5m
monitoring_alert_repeat_interval: 4h

# A live test posts a real message in the channel, so it fires ONLY when the webhook
# configuration actually changed. A replay that changes nothing must stay silent.
monitoring_alert_test_on_change: true

# --- Alert rules (SCRUM-131, first slice) -----------------------------------------------
# Provisioned by file like everything else. Only Loki exists as a datasource today, so
# these are log-based; the container-state rules arrive with the metrics stack (SCRUM-99).
monitoring_alert_rules_enabled: true
# Reuses the folder the dashboard provider already creates, so rule provisioning never has
# to create one itself.
monitoring_alert_rules_folder: GREENER
monitoring_alert_rules_interval: 1m

# Error-rate rule: how many error lines within the window is abnormal, per service.
# This now runs on REAL logs, so 10 per 5 min is a first honest guess and the number most
# likely to need retuning — watch the dashboard's error panel for a week before trusting it.
# What it will catch first is the gateway: nginx logs a missing favicon at [error], so a
# crawler alone can produce a handful per minute. That is the rule working, not misfiring;
# the fix is to stop serving 404s, not to raise the threshold reflexively.
# To exercise the whole path on demand, deploy once with -e monitoring_alert_error_threshold=0.
monitoring_alert_error_window: 5m
monitoring_alert_error_threshold: 10
monitoring_alert_error_for: 5m
# Query time range in seconds. Must comfortably exceed the window above.
monitoring_alert_error_range: 600

# Silence rule = the provisional "service is down" proxy, and the reason there is ONE RULE
# PER SERVICE: a dead service stops producing a Loki stream, so it vanishes from the result
# set instead of reporting zero. A single rule aggregating every service would therefore
# never notice one of them dying. Per-service rules turn that disappearance into NoData on
# a named rule, which noDataState promotes to an alert.
#
# THE ASSUMPTION THIS RULE MAKES, AND WHY IT IS TIED TO THE GENERATOR:
# it treats silence as death, which only holds for a source that logs unconditionally. The
# generator does (1-5 lines per service per minute, no matter what). The real services do
# NOT: a FastAPI backend logs on request, so at 03:00 with no users it emits nothing, and
# this rule would page for a service that is perfectly healthy. Caddy and the AI service
# behave the same, Postgres is near-silent at rest.
#
# THAT DAY HAS COME (SCRUM-129), so these rules are OFF and the teardown below deletes
# them from Grafana. They are kept in the code, not deleted, until the teardown has run in
# every environment — a provisioned rule whose file disappears keeps evaluating forever.
# Real "is this container alive" detection is SCRUM-99, and the information already exists
# on the host: app_stack defines Docker healthchecks for backend, postgres, qdrant and ai.
# It is simply not exposed to Grafana yet.
#
# The rule was also slow by nature: it had to wait out the window before concluding.
monitoring_alert_silence_enabled: "{{ monitoring_sample_logs_enabled }}"
# The uids to delete are the ones that were DEPLOYED, so this stays the generator's list.
# Pointing it at the real services would orphan the four rules Grafana still holds.
monitoring_alert_watched_services: "{{ monitoring_sample_services }}"
monitoring_alert_silence_window: 10m
monitoring_alert_silence_for: 10m
monitoring_alert_silence_range: 1800

# --- Metric-based rules (SCRUM-99) ------------------------------------------------------
# These are the rules the log-based ones could never be. cAdvisor emits series for a
# container as long as it RUNS, whatever the container says or does not say, so a
# disappearance means death rather than a quiet night.
monitoring_alert_metrics_rules_enabled: true

# The services expected to be running. Unlike the log silence rules this list is the REAL
# one, because absence here is a fact about the container and not about its chattiness.
monitoring_alert_expected_containers: [gateway, backend, ai, postgres, qdrant]
monitoring_alert_container_down_for: 5m

# Disk is the tightest constraint on this host (77% of 77 GB at the time of writing), and
# the first thing a full log pipeline will threaten. 85% leaves roughly 11 GB of warning.
monitoring_alert_disk_threshold: 85
monitoring_alert_disk_for: 10m

# MemAvailable-based, so the page cache is not counted as used. 15 GB of RAM with ~2 GB in
# use today: crossing 90% means something is genuinely leaking.
monitoring_alert_memory_threshold: 90
monitoring_alert_memory_for: 10m

# Query time range in seconds for the metric rules.
monitoring_alert_metrics_range: 600

# Stable uids, split wanted/unwanted like the Grafana accounts in users.yml. Removing a
# rule from the rendered file does NOT remove it from Grafana, which keeps provisioned
# resources in its own database — so every uid this role knows must be either declared or
# explicitly deleted. Without the unwanted list, turning the silence rules off would leave
# them evaluating and notifying forever.
monitoring_alert_silence_uids: >-
  {{ monitoring_alert_watched_services | map('regex_replace', '^', 'greener-silent-') | list }}
monitoring_alert_container_down_uids: >-
  {{ monitoring_alert_expected_containers
     | map('regex_replace', '^', 'greener-container-down-') | list }}
monitoring_alert_metrics_uids: >-
  {{ ['greener-disk-low', 'greener-memory-high'] + monitoring_alert_container_down_uids }}
# Everything this role can deploy, whatever the current flags.
monitoring_alert_all_uids: >-
  {{ ['greener-error-rate'] + monitoring_alert_silence_uids + monitoring_alert_metrics_uids }}
# What rules.yml declares on this run.
monitoring_alert_wanted_uids: >-
  {{ (['greener-error-rate']
      + (monitoring_alert_silence_enabled | bool | ternary(monitoring_alert_silence_uids, []))
      + (monitoring_alert_metrics_rules_enabled | bool
         | ternary(monitoring_alert_metrics_uids, [])))
     if monitoring_alert_rules_enabled | bool else [] }}
# What must be deleted from Grafana on this run.
monitoring_alert_unwanted_uids: >-
  {{ monitoring_alert_all_uids | difference(monitoring_alert_wanted_uids) }}

---
# Log stack: Loki (store) + Alloy (collector) + Grafana (UI), deployed with docker compose
# in its OWN project, separate from app_stack — a monitoring change must never restart the
# application, and an application deploy must never restart the observability stack.
#
# SCRUM-129 wired the REAL sources: Alloy reads the application containers through the
# Docker API and the native services (Caddy, the CD webhook) from the systemd journal. The
# synthetic generator it replaced is off below and its teardown still runs.
# Still provisional: Grafana publishes on LOOPBACK only and Caddy re-exposes it publicly
# (grafana_public), because there is no VPN yet. Binding it to the VPN address belongs to
# SCRUM-58, which has to land first — it is no longer part of SCRUM-129.

monitoring_enabled: true

# On-host layout. Deliberately NOT /opt/greener: a separate compose project means a
# separate directory, otherwise the two projects fight over docker-compose.yml.
monitoring_dir: /opt/greener-monitoring
monitoring_compose_file: "{{ monitoring_dir }}/docker-compose.yml"
monitoring_env_file: "{{ monitoring_dir }}/.env"
# The exporter's own credentials file (see monitoring_postgres_exporter_enabled below).
monitoring_postgres_exporter_env_file: "{{ monitoring_dir }}/postgres-exporter.env"
monitoring_config_dir: "{{ monitoring_dir }}/config"
monitoring_grafana_provisioning_dir: "{{ monitoring_dir }}/grafana/provisioning"
monitoring_grafana_dashboards_dir: "{{ monitoring_dir }}/grafana/dashboards"

# Root-owned: unlike app_stack, nothing here is re-rendered by the non-human CD account.
monitoring_owner: root
monitoring_group: root

# Isolated from greener_internal, and it STAYS isolated now that the real container logs
# are collected: loki.source.docker reads them through the Docker API (the daemon hands over
# the stream), not by connecting to the containers. Nothing here needs to reach them.
monitoring_network: greener_monitoring

# Pinned images — bump deliberately, never track a floating tag.
monitoring_loki_image: "grafana/loki:3.7.7"
# Alloy, not Promtail: Promtail reached end of life in March 2026 and Grafana's migration
# path is Alloy. No point standing up a collector we would have to replace immediately.
monitoring_alloy_image: "grafana/alloy:v1.19.2"
monitoring_grafana_image: "grafana/grafana:13.2.2"

monitoring_loki_port: 3100
monitoring_grafana_port: 3000
# Alloy's own UI/metrics endpoint; stays inside the compose network.
monitoring_alloy_port: 12345

# Grafana is the only service of this stack that publishes anything, and only on loopback,
# so Caddy remains the single host-facing service. Reach it with an SSH tunnel:
#   ssh -L 3000:127.0.0.1:3000 <user>@<vps>   then http://localhost:3000
monitoring_grafana_publish: "127.0.0.1:{{ monitoring_grafana_port }}"

# Public URL, used only when grafana_public is on (see group_vars/all/vars.yml). Grafana
# needs to know its external origin or its redirects and asset links point at localhost.
monitoring_grafana_root_url: "https://grafana.{{ caddy_domain }}/"

monitoring_grafana_admin_user: admin

# Session lifetime, applied only while grafana_public is on (see the compose file).
# Grafana's own default is 30 days.
monitoring_grafana_session_lifetime: "7d"

# Loki retention. Kept at 7 days now that the producers are real: the host is at 77% of a
# 77 GB disk, so this is the variable to look at first if it tightens (and the reason the
# healthcheck noise below is dropped rather than stored).
monitoring_loki_retention: "168h"

monitoring_loki_data_volume: loki_data
monitoring_grafana_data_volume: grafana_data
monitoring_alloy_data_volume: alloy_data
monitoring_prometheus_data_volume: prometheus_data

# --- Metrics (SCRUM-99) ------------------------------------------------------------------
# Prometheus is a STORE here, not a collector. The exporters (node + cAdvisor) run inside
# Alloy, which already runs as root with the host's /proc, /sys and the Docker socket — a
# separate cAdvisor container would need `privileged` to get privileges Alloy already holds.
# Alloy remote-writes the series in; Prometheus scrapes nothing but itself.
monitoring_prometheus_image: "prom/prometheus:v3.7.1"
monitoring_prometheus_port: 9090

# 15 s: fine enough to see a spike on a 4-vCPU host, coarse enough that the series stay
# small. Also copied into the Grafana datasource as timeInterval — leave the two equal, or
# Grafana proposes step values Prometheus has no points for and the graphs show gaps.
monitoring_prometheus_scrape_interval: "15s"

# 15 days of metrics against 7 of logs. Metrics are far cheaper per unit of time and are
# what you need to answer "was this slow last week too"; the disk is the limit (77% used),
# so this is the second variable to look at after the Loki retention.
monitoring_prometheus_retention: "15d"

# Where the HOST filesystem is mounted inside Alloy. The exporters must be pointed at these
# or they describe the collector instead of the machine. /sys keeps its own name because
# cAdvisor has no path-prefix option — it always reads /sys/fs/cgroup.
monitoring_host_rootfs_mount: /host/rootfs
monitoring_host_procfs_mount: /host/proc
monitoring_host_sysfs_mount: /sys

# Docker on this host runs the containerd snapshotter: `docker info` reports the `overlayfs`
# storage driver, not `overlay2`. cAdvisor then has to ask containerd itself for a
# container's filesystem layers, so it needs this socket on top of the Docker one. Alloy's
# own default for containerd_host is this very path, which is why mounting it at the same
# place inside the container needs no Alloy config at all.
monitoring_containerd_socket: /run/containerd/containerd.sock

# --- Container health ----------------------------------------------------------------------
# NOT from cAdvisor. Its container_health_state is read ONCE, when it first discovers a
# container, and never refreshed: every container a deploy recreates stays pinned at
# "starting" (0) for ever, so the greener-unhealthy-* rules paged five minutes after each
# deploy and never resolved. Verified in production (23/09/2026): every healthy container
# read 0, and the only one reading 1 was the one already healthy when Alloy started.
# A systemd timer writes the real status where the node exporter's textfile collector reads it.
monitoring_container_health_script: /usr/local/bin/greener-container-health
monitoring_container_health_dir: "{{ monitoring_dir }}/textfile"
monitoring_container_health_file: "{{ monitoring_container_health_dir }}/container_health.prom"
monitoring_container_health_unit: greener-container-health
monitoring_container_health_interval: 30s
# Four missed runs. Past that the rules stop reading the file instead of alerting on frozen
# values — exactly the failure this collector replaces.
monitoring_container_health_max_age: 120

# Queried through Grafana's datasource proxy rather than Prometheus directly: Prometheus
# publishes no host port (only Grafana does), so this is the one door in from the host.
monitoring_prometheus_query_api: >-
  http://{{ monitoring_grafana_publish
  }}/api/datasources/proxy/uid/prometheus/api/v1/query

# The queries that prove each exporter really ran. A healthy datasource only proves the
# store answers; if the exporters are misconfigured Prometheus stays happy and every panel
# is empty, which is the failure this catches. node_uname_info exists only if the node
# exporter ran; `up` for the cAdvisor job only if Alloy scraped it. Each entry must return
# at least one series or the deploy fails.
monitoring_metrics_probes_base:
  - node_uname_info
  # The textfile collector: proves the health timer ran AND that Alloy reads its directory.
  - greener_container_health
  - 'up{job="integrations/cadvisor"}'
  # The probe that matters, added after the first production run paged five times for
  # containers that were all running: `up` only proves Alloy SCRAPED cAdvisor, never that
  # cAdvisor managed to read a single container. Asserting one series per expected container
  # is what makes a broken exporter fail the deploy instead of firing every container-down
  # alert at once.
  - >-
    count(container_last_seen{project="{{ monitoring_app_compose_project }}"})
    >= {{ monitoring_alert_expected_containers | length }}

# Each new exporter adds its own cheapest proof. Same reasoning as the cAdvisor probe: an
# exporter that starts but never produces a series leaves Prometheus healthy and every new
# panel empty, and the rules built on it either never fire or fire for ever. Failing the
# DEPLOY is the only moment this is cheap to notice.
monitoring_metrics_probes: >-
  {{ monitoring_metrics_probes_base
     + (monitoring_blackbox_enabled | bool
        | ternary(['probe_ssl_earliest_cert_expiry'], []))
     + (monitoring_postgres_exporter_enabled | bool
        | ternary(['pg_up', 'pg_settings_max_connections'], [])) }}

# --- Real log sources (SCRUM-129) --------------------------------------------------------
# Source 1: the containers of the application compose project, read over the Docker API.
#
# An ALLOW-list, and it has to be one: this host also runs containers that are nothing to do
# with GREENER, plus the monitoring stack's own three (whose logs must not be shipped into
# the Loki they describe). The value is the compose project name, which compose derives from
# the directory holding the project — app_stack_dir, i.e. /opt/greener. Hardcoded rather
# than read from app_stack: a role must not depend on another role's defaults being in
# scope. If app_stack_dir ever moves, this follows.
monitoring_app_compose_project: greener

# How often Alloy asks the daemon which containers exist. A container started between two
# refreshes has its first lines collected from the start anyway (the API replays them).
monitoring_docker_refresh_interval: "15s"

# Source 2: the systemd journal, for the services that run natively and have no container.
# An allow-list again, for a different reason: on a VPS whose SSH is still public, most of
# the journal is sshd refusing internet scans. Adding a unit here is a one-line change.
monitoring_journal_units:
  - caddy.service
  # The dump job: its only output is journald, so without this line the "logs associés"
  # panel of the backup row on the PostgreSQL dashboard is empty by construction.
  - greener-db-backup.service
  - greener-db-sync.service
  - greener-webhook.service
  - docker.service

# Mirrors webhook_service (roles/webhook/defaults). Duplicated on purpose — roles/webhook
# runs AFTER monitoring in site.yml, so its defaults are not in scope here and a
# `webhook_service | default(...)` would silently always take the default.
monitoring_webhook_service: greener-webhook

# Bounds a cold start: without it, a first run (or a run after Alloy was down) replays the
# whole persistent journal into Loki.
monitoring_journal_max_age: "12h"

# The backend probes itself every 10 s and uvicorn logs every probe — ~8 600 lines a day
# that only say "the probe ran". Dropped in the pipeline, not stored and filtered out later:
# a line nobody will ever read should cost neither index nor disk. Scoped to the loopback
# client, so a real /health call from outside is still collected.
monitoring_drop_healthcheck_logs: true

# docker compose --wait budget for the bring-up (seconds).
monitoring_wait_timeout: 300

# --- Grafana accounts -------------------------------------------------------------------
# Driven by group_vars/all/users.yml: an account's `grafana:` field is its org role
# (Admin | Editor | Viewer); no field means no Grafana account at all. Users are the one
# thing Grafana cannot provision from files, so the role drives its admin API instead.
monitoring_grafana_users_enabled: true
monitoring_grafana_api: "http://{{ monitoring_grafana_publish }}"
monitoring_grafana_org_id: 1
# Grafana requires an email per account and uses it as a second unique key. Nothing is ever
# sent to it (no SMTP configured), so a synthetic domain is honest: people sign in with
# their login, not their address.
monitoring_grafana_email_domain: "greener.local"
# One password per login, from the env vault (vault_grafana_user_passwords). Empty here so
# the role fails loudly on a missing entry instead of quietly sharing one password: the
# real map comes from group_vars/all/vars.yml.
grafana_user_passwords: {}
# Org roles Grafana accepts. Viewer cannot use Explore (ad-hoc log querying), which is
# exactly what a dev needs during an incident — hence Editor for the devs, not Viewer.
monitoring_grafana_roles: [Admin, Editor, Viewer]

# --- Alerting: one Discord channel ------------------------------------------------------
# Grafana Alerting routes every rule to a single Discord channel, provisioned by file like
# the datasource and the dashboards: a contact point edited in the UI does not survive a
# restart. The rules that feed it are SCRUM-131; this only builds the channel.
# Turning this off does not merely stop managing alerting, it stops the notifications:
# Grafana keeps provisioned resources in its own database, so the role renders a teardown
# that resets the root notification policy instead of just deleting the files.
monitoring_alerting_enabled: true
monitoring_alerting_dir: "{{ monitoring_grafana_provisioning_dir }}/alerting"

# Used as BOTH the receiver uid and its name: the notification policy routes by name, the
# provisioning file identifies the receiver by uid. Changing it recreates the contact point.
monitoring_alert_contact_point: greener-discord

# Full shape of a Discord webhook URL, anchored at both ends: id is numeric, token is
# URL-safe base64. Anchoring the end is what catches a truncated paste or a trailing
# newline, which a prefix-only check would wave through.
monitoring_alert_webhook_pattern: '^https://(discord|discordapp)\.com/api/webhooks/[0-9]+/[A-Za-z0-9._-]+$'

# Name of the env var Grafana reads the webhook URL from. Grafana interpolates $VAR inside
# provisioning files, so the URL stays in the 0600 .env and never lands in a 0644 file.
monitoring_alert_webhook_env: GREENER_DISCORD_ALERT_WEBHOOK

# Notification policy timings. Single VPS, one person on call: group aggressively and
# repeat rarely — a channel that cries every minute is a channel nobody reads any more.
# Base for the deep link the Discord message carries. Built here rather than from
# Grafana's runtime `.ExternalURL`, which keeps its trailing slash and yields `//d/...` —
# verified against a real notification, not assumed.
monitoring_alert_logs_link_base: >-
  {{ monitoring_grafana_root_url | regex_replace('/+$', '') }}

monitoring_alert_group_by: [alertname, env, service]
monitoring_alert_group_wait: 30s
monitoring_alert_group_interval: 5m
monitoring_alert_repeat_interval: 4h

# A live test posts a real message in the channel, so it fires ONLY when the webhook
# configuration actually changed. A replay that changes nothing must stay silent.
monitoring_alert_test_on_change: true

# --- Alert rules (SCRUM-131, first slice) -----------------------------------------------
# Provisioned by file like everything else. Only Loki exists as a datasource today, so
# these are log-based; the container-state rules arrive with the metrics stack (SCRUM-99).
monitoring_alert_rules_enabled: true
# Reuses the folder the dashboard provider already creates, so rule provisioning never has
# to create one itself.
monitoring_alert_rules_folder: GREENER
monitoring_alert_rules_interval: 1m

# Error-rate rule: how many error lines within the window is abnormal, per service.
# This now runs on REAL logs, so 10 per 5 min is a first honest guess and the number most
# likely to need retuning — watch the dashboard's error panel for a week before trusting it.
# What it will catch first is the gateway: nginx logs a missing favicon at [error], so a
# crawler alone can produce a handful per minute. That is the rule working, not misfiring;
# the fix is to stop serving 404s, not to raise the threshold reflexively.
# To exercise the whole path on demand, deploy once with -e monitoring_alert_error_threshold=0.
monitoring_alert_error_window: 5m
monitoring_alert_error_threshold: 10
monitoring_alert_error_for: 5m
# Query time range in seconds. Must comfortably exceed the window above.
monitoring_alert_error_range: 600

# --- Metric-based rules (SCRUM-99) ------------------------------------------------------
# These are the rules the log-based ones could never be. cAdvisor emits series for a
# container as long as it RUNS, whatever the container says or does not say, so a
# disappearance means death rather than a quiet night.
monitoring_alert_metrics_rules_enabled: true

# The services expected to be running. This list can be the REAL one, because absence here
# is a fact about the container rather than about how talkative it is.
monitoring_alert_expected_containers: [gateway, backend, ai, postgres, qdrant]
monitoring_alert_container_down_for: 5m

# Disk is the tightest constraint on this host (77% of 77 GB at the time of writing), and
# the first thing a full log pipeline will threaten. 85% leaves roughly 11 GB of warning.
monitoring_alert_disk_threshold: 85
monitoring_alert_disk_for: 10m

# MemAvailable-based, so the page cache is not counted as used. 15 GB of RAM with ~2 GB in
# use today: crossing 90% means something is genuinely leaking.
monitoring_alert_memory_threshold: 90
monitoring_alert_memory_for: 10m

# Restart loop. THE gap the other rules leave: a container that dies and comes back every
# minute is `running` most of the time, so greener-container-down-* never fills its 5 min
# `for`, and the external probe (SCRUM-90) sees a facade that answers between two deaths.
#
# `changes()` on the container's start time counts restarts. A DEPLOY does not trip it: a
# compose recreate gives the container a new id, so cAdvisor starts a fresh series whose
# start time has never changed. Only a restart in place — which is what a crash loop is —
# moves the value of an existing series.
monitoring_alert_restart_window: 15m
# Strictly greater than, so this is "4 starts in 15 minutes". One restart is an incident
# recovering by itself; three in a quarter of an hour is a loop.
monitoring_alert_restart_threshold: 3
monitoring_alert_restart_for: 2m

# Docker healthchecks, which say more than "the process exists". The source is
# greener_container_health (1 healthy, 0 unhealthy or starting, no series without a
# healthcheck) — see the container-health section above for why it is not cAdvisor's.
#
# THE TRAP, verified against production rather than assumed: "starting" also reads as 0, so
# each grace period must outlast that service's start_period in app_stack. The AI service
# indexes every region before answering and its start_period is 20 MINUTES, so a uniform
# 5 min would page on every single AI restart.
#
# Adding a healthcheck to a service means adding it here; removing one means removing it
# here, or its rule sits on a metric that no longer exists.
monitoring_alert_healthcheck_grace:
  postgres: 5m
  backend: 5m
  qdrant: 5m
  ai: 25m

# Query time range in seconds for the metric rules.
monitoring_alert_metrics_range: 600

# Stable uids, split wanted/unwanted like the Grafana accounts in users.yml. Removing a
# rule from the rendered file does NOT remove it from Grafana, which keeps provisioned
# resources in its own database — so every uid this role knows must be either declared or
# explicitly deleted. This is exactly what retired the greener-silent-* rules: they were
# turned off, the teardown deleted them from Grafana, and only then was their code removed.
# KEEP THE SAME ORDER for anything retired later, or the rules outlive their code and go on
# notifying with nothing in the repository to explain them.
# --- Routing: one channel, two doors (LBT, 22/09/2026) ----------------------------------
# Decision: everything still lands in the SAME #alerting channel. What changed is the
# route, not the destination — a `critical` has to wake somebody up, a `warning` must not.
#
# Two contact points on ONE webhook, because Grafana's Discord notifier forces the choice:
# reading receivers/discord/v1/discord.go, `UseEmbedDescription: true` sets
# `msg.Content = ""` OUTRIGHT. Discord only raises a mention notification from `content`,
# so a ping and an embed description are mutually exclusive per contact point — no
# template can work around it. The embed itself (coloured title, footer) survives either
# way, so the critical door keeps the red title and loses only the masked links.
monitoring_alert_contact_point_critical: greener-discord-critical

# Who gets woken. The numeric form, not @lucasyaisy: a Discord display name can change,
# the id cannot. Set to "" to keep the critical route without pinging anyone.
monitoring_alert_critical_mention: "<@238398635149099008>"

# Night silence, warnings only. A `critical` is never muted — that is the whole point of
# separating them.
#
# NOT A DEFERRAL, A SUPPRESSION: Alertmanager mute timings DROP notifications, they do not
# replay them when the window ends. A warning that fires at 23:05 and resolves at 03:00 is
# never announced; it exists only in Grafana's history. Acceptable for a warning by
# definition — if it needed waking someone, it would be a critical.
monitoring_alert_night_mute_enabled: true
monitoring_alert_night_mute_name: nuit-warning
monitoring_alert_night_mute_location: "Europe/Paris"
# TWO ranges, and it has to be two: an Alertmanager time interval cannot cross midnight.
# A single 23:00-08:00 entry is silently never true, which is the worst possible failure
# mode here — it looks configured and mutes nothing.
monitoring_alert_night_mute_ranges:
  - {start_time: "23:00", end_time: "24:00"}
  - {start_time: "00:00", end_time: "08:00"}

# --- CPU (host) -------------------------------------------------------------------------
# The dashboard has shown "charge par coeur" since SCRUM-99 and nothing alerted on it,
# unlike disk and RAM. Load per core above 2 means processes are queueing for CPU on a
# 4-vCPU host; a warning rather than a critical because high load is a symptom, and on
# this host it is usually the AI service doing exactly what it was asked to do.
monitoring_alert_cpu_threshold: 2
monitoring_alert_cpu_for: 15m

# --- Memory per container ---------------------------------------------------------------
# greener-memory-high watches the MACHINE and can never say who is eating it. This one can.
#
# The threshold is a PERCENTAGE OF THE CONTAINER'S OWN LIMIT, read from cAdvisor
# (container_spec_memory_limit_bytes), not a hardcoded map: the day a limit moves in
# app_stack, the rule follows on its own with nothing to keep in sync here. That is also
# why app_stack now sets mem_limit on every service — without a limit cAdvisor reports 0,
# the series is filtered out below, and this rule silently covers nothing.
monitoring_alert_container_memory_threshold: 85
monitoring_alert_container_memory_for: 10m
# Services whose memory saturation is a critical rather than a warning. The AI service is
# the one consumer big enough to take the host down on its own (LBT: priority).
monitoring_alert_memory_critical_services: [ai]

# --- Disk, predictive -------------------------------------------------------------------
# Complements greener-disk-low, does not replace it. Being told AT 85% leaves no time to
# decide what to purge; being told "full in under 4 days at the current rate" does.
# 6h of history so a single log burst does not extrapolate into a panic.
monitoring_alert_disk_predict_window: 6h
monitoring_alert_disk_predict_horizon_days: 4
monitoring_alert_disk_predict_for: 30m

# --- Blackbox probes (TLS expiry) --------------------------------------------------------
# Runs inside Alloy like the other exporters. Caddy does NOT export certificate expiry —
# checked, it has no such metric — so a probe is the only way to see a renewal that failed.
# The probe leaves the host and comes back through the public name, which is the point:
# it measures the certificate a browser is actually served.
#
# This is NOT a replacement for UptimeRobot (docs/uptime-externe.md): a probe running ON
# the VPS cannot report that the VPS is down.
monitoring_blackbox_enabled: true
monitoring_blackbox_module: http_2xx
monitoring_blackbox_timeout: "5s"
monitoring_blackbox_scrape_interval: "60s"
monitoring_blackbox_targets:
  - name: api
    address: "https://api.{{ caddy_domain }}/health/db"
  - name: front
    address: "https://greenhub.{{ caddy_domain }}"
  - name: grafana
    address: "{{ monitoring_grafana_root_url }}"

# ACME renews at 30 days remaining. Crossing 21 therefore means a renewal has ALREADY
# failed once — the number is a consequence, not a preference. 7 days is the point where
# it stops being a maintenance task and starts being an outage with a date on it.
monitoring_alert_tls_warning_days: 21
monitoring_alert_tls_critical_days: 7
# Long `for`: a certificate does not flap, and a single failed probe must not page.
monitoring_alert_tls_for: 1h

# --- Edge errors (Caddy access logs) -----------------------------------------------------
# The cheapest possible stand-in for real API metrics: Caddy already logs every response
# into the journal, which Alloy already ships. Counting 5xx there tells us the API is
# ANSWERING BADLY — the one thing "is the container running" can never say — without
# touching the backend repo.
#
# An absolute count, not a ratio. With today's traffic a ratio is noise: one request, one
# error, 100%. Revisit once there are real users.
monitoring_alert_edge_5xx_enabled: true
monitoring_alert_edge_5xx_window: 5m
monitoring_alert_edge_5xx_threshold: 10
monitoring_alert_edge_5xx_for: 5m
monitoring_alert_edge_5xx_range: 600

# --- PostgreSQL exporter ------------------------------------------------------------------
# ARCHITECTURE, and it reverses what docs/dashboards-et-alertes.md first recommended.
# The exporter must reach Postgres (greener_internal) and be scraped by Alloy
# (greener_monitoring). The "keep the networks isolated" option was to publish the
# exporter on a host port and scrape it through the host — but a container cannot reach a
# 127.0.0.1-published port (host-gateway resolves to the bridge address, not loopback), so
# it would have to publish on 0.0.0.0 while the firewall role is still a stub. That trades
# a private container-to-container link for a port open to the internet.
#
# So the exporter joins BOTH networks and is the single, deliberate bridge between them:
# one container, read-only queries, no inbound path from the application side.
monitoring_postgres_exporter_enabled: true
monitoring_postgres_exporter_image: "quay.io/prometheuscommunity/postgres-exporter:v0.18.1"
monitoring_postgres_exporter_port: 9187
# The app compose project's network, as Docker names it: <project>_<network>. Follows
# monitoring_app_compose_project, so it moves if the project directory ever moves.
monitoring_app_network: "{{ monitoring_app_compose_project }}_greener_internal"

# Mirrors roles/backend/defaults (backend_db_*). Duplicated on purpose, exactly like
# monitoring_webhook_service above: roles/backend runs before monitoring but its defaults
# are NOT in scope here, so a `backend_db_name | default(...)` would silently always take
# the default and connect to the wrong database.
monitoring_pg_host: postgres
monitoring_pg_port: 5432
monitoring_pg_name: greener
monitoring_pg_user: greener

# The exporter connects as the application user. KNOWN SHORTCUT: a dedicated role with
# pg_monitor would be least-privilege, but creating it needs a DB-side task the backend
# owns. Revisit when the backend repo manages its own migrations for roles.
monitoring_pg_dsn_env: DATA_SOURCE_NAME

monitoring_alert_pg_connections_threshold: 80
monitoring_alert_pg_connections_for: 5m
# The exporter going blind looks exactly like "everything is fine" on a dashboard: empty
# panels and no alert. This is the rule that makes silence audible.
monitoring_alert_pg_down_for: 5m

# --- Backups -------------------------------------------------------------------------------
# The staleness threshold is the REAL backup alert, and it is deliberately not "the script
# exited non-zero". A script only reports a failure when it runs; the failure nobody ever
# catches is the timer that stopped firing, and the only thing that sees it is the age of
# the last success. 7 h = two missed occurrences of a 3-hourly dump, so a single skipped
# slot (a reboot, a long deploy) does not page anyone.
monitoring_alert_backup_stale_seconds: 25200
monitoring_alert_backup_for: 10m

# Same 7 h for the off-site copy, and it is arguably the more important of the two: a dump
# that exists only on the VPS is not a backup against losing the VPS, which is the scenario
# the whole DRP is written for. The sync runs on the same 3 h cadence, offset 20 minutes.
monitoring_alert_backup_sync_stale_seconds: 25200

# The two memory rules, built from the list above rather than written twice. A rule's
# labels are static in Grafana, so one rule cannot carry two severities — splitting the
# SELECTOR is the only way to say "ai is critical, the rest is a warning".
#
# An empty critical list renders an empty selector, and the template skips that entry
# entirely: no rule matching nothing, and the warning rule widens to every service.
monitoring_alert_container_memory_classes:
  - uid: greener-memory-container-critical
    label: Services whose memory is a critical
    title: Mémoire conteneur saturée
    severity: critical
    selector: >-
      {{ ('=~"' ~ (monitoring_alert_memory_critical_services | join('|')) ~ '"')
         if monitoring_alert_memory_critical_services | length > 0 else '' }}
  - uid: greener-memory-container
    label: Every other service
    title: Mémoire conteneur élevée
    severity: warning
    selector: >-
      {{ ('!~"' ~ (monitoring_alert_memory_critical_services | join('|')) ~ '"')
         if monitoring_alert_memory_critical_services | length > 0 else '=~".+"' }}

# Two TLS rules over ONE query. The critical is a plain `lt`; the warning is a RANGE whose
# lower bound is the critical threshold — without it both would fire under
# monitoring_alert_tls_critical_days and the same certificate would be announced twice.
monitoring_alert_tls_classes:
  - uid: greener-tls-expiry-critical
    label: TLS expiry — critical
    title: Certificat TLS expirant
    severity: critical
    evaluator: lt
    params: "[{{ monitoring_alert_tls_critical_days }}]"
    threshold_days: "{{ monitoring_alert_tls_critical_days }} jours"
  - uid: greener-tls-expiry-warning
    label: TLS expiry — warning
    title: Renouvellement TLS en retard
    severity: warning
    evaluator: within_range
    params: "[{{ monitoring_alert_tls_critical_days }}, {{ monitoring_alert_tls_warning_days }}]"
    threshold_days: "{{ monitoring_alert_tls_warning_days }} jours"

monitoring_alert_container_down_uids: >-
  {{ monitoring_alert_expected_containers
     | map('regex_replace', '^', 'greener-container-down-') | list }}
monitoring_alert_unhealthy_uids: >-
  {{ monitoring_alert_healthcheck_grace.keys() | list
     | map('regex_replace', '^', 'greener-unhealthy-') | list }}
monitoring_alert_metrics_uids: >-
  {{ ['greener-disk-low', 'greener-memory-high', 'greener-restart-loop',
      'greener-cpu-high', 'greener-disk-predict',
      'greener-memory-container', 'greener-memory-container-critical']
     + monitoring_alert_container_down_uids + monitoring_alert_unhealthy_uids }}
# Gated on their own exporter rather than on the metrics flag: a TLS rule with no blackbox
# probe behind it evaluates for ever on a series that will never exist.
monitoring_alert_blackbox_uids: >-
  {{ ['greener-tls-expiry-warning', 'greener-tls-expiry-critical'] }}
monitoring_alert_postgres_uids: >-
  {{ ['greener-pg-connections', 'greener-pg-down'] }}
monitoring_alert_logs_uids: >-
  {{ ['greener-error-rate']
     + (monitoring_alert_edge_5xx_enabled | bool
        | ternary(['greener-edge-5xx'], [])) }}
# Everything this role can deploy, whatever the current flags.
monitoring_alert_all_uids: >-
  {{ ['greener-error-rate', 'greener-edge-5xx'] + monitoring_alert_metrics_uids
     + monitoring_alert_blackbox_uids + monitoring_alert_postgres_uids }}
# What rules.yml declares on this run.
monitoring_alert_wanted_uids: >-
  {{ (monitoring_alert_logs_uids
      + (monitoring_alert_metrics_rules_enabled | bool
         | ternary(monitoring_alert_metrics_uids, []))
      + (monitoring_blackbox_enabled | bool
         | ternary(monitoring_alert_blackbox_uids, []))
      + (monitoring_postgres_exporter_enabled | bool
         | ternary(monitoring_alert_postgres_uids, [])))
     if monitoring_alert_rules_enabled | bool else [] }}
# What must be deleted from Grafana on this run.
monitoring_alert_unwanted_uids: >-
  {{ monitoring_alert_all_uids | difference(monitoring_alert_wanted_uids) }}

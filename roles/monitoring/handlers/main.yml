---
# Configs are bind-mounted, so compose sees no change when they do: each container is
# restarted explicitly by the task that rendered its config.
- name: Restart loki
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    files:
      - docker-compose.yml
    services:
      - loki
    state: restarted
  when: monitoring_enabled | bool

- name: Restart alloy
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    files:
      - docker-compose.yml
    services:
      - alloy
    state: restarted
  when: monitoring_enabled | bool

- name: Restart grafana
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    files:
      - docker-compose.yml
    services:
      - grafana
    state: restarted
  when: monitoring_enabled | bool

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

---
# Configs are bind-mounted, so compose sees no change when they do: each container is
# restarted explicitly by the task that rendered its config.
#
# All of them are skipped under --check, and must be: in a dry run the config the container
# would re-read was never written, and the container itself may not exist yet — a service
# this run introduces, or a fresh host where nothing is up. Without the guard, `make check`
# fails with "no such service" on any change that adds one.
- name: Restart loki
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    files:
      - docker-compose.yml
    services:
      - loki
    state: restarted
  when:
    - monitoring_enabled | bool
    - not ansible_check_mode

- name: Restart alloy
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    files:
      - docker-compose.yml
    services:
      - alloy
    state: restarted
  when:
    - monitoring_enabled | bool
    - not ansible_check_mode

- name: Restart prometheus
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    files:
      - docker-compose.yml
    services:
      - prometheus
    state: restarted
  when:
    - monitoring_enabled | bool
    - not ansible_check_mode

- name: Restart grafana
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    files:
      - docker-compose.yml
    services:
      - grafana
    state: restarted
  when:
    - monitoring_enabled | bool
    - not ansible_check_mode

- name: Restart postgres_exporter
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    files:
      - docker-compose.yml
    services:
      - postgres_exporter
    state: restarted
  when:
    - monitoring_enabled | bool
    - monitoring_postgres_exporter_enabled | bool
    - not ansible_check_mode

- name: Restart greener-container-health
  ansible.builtin.systemd:
    name: "{{ monitoring_container_health_unit }}.timer"
    state: restarted
    daemon_reload: true
  when:
    - monitoring_enabled | bool
    - not ansible_check_mode

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

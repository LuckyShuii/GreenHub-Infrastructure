---
# Materializes vault secrets into an on-host .env for the FastAPI backend. The app only
# ever sees plain env var names (contract = .env.example in the backend repo).

- name: Ensure backend app directory exists
  ansible.builtin.file:
    path: "{{ backend_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# diff: false → the Makefile runs --check --diff; without it the rendered secrets
# would land in stdout / CI logs on every change.
# no_log → covers what diff: false doesn't: verbose runs (-v/-vvv) and failure output
# serialize the full task result, secrets included. Trade-off: it also censors error
# messages, so it can be disabled for local debugging with -e hide_secrets=false
# (never in CI).
- name: Deploy backend .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ backend_env_path }}"
    owner: "{{ backend_env_owner }}"
    group: "{{ backend_env_group }}"
    mode: "0600"
  diff: false
  no_log: "{{ hide_secrets | default(true) }}"

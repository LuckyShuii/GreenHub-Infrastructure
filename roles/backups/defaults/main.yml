---
# --- Master switch -------------------------------------------------------------------------
# Same reasoning as app_stack/monitoring: the script and units are always deployed (so a
# --check on a fresh host shows the real diff), but the timer is only started where the
# stack it dumps actually exists.
backups_enabled: true

# --- What we dump --------------------------------------------------------------------------
# The container is found by its compose labels, never by name: compose derives container
# names from the project directory, so hardcoding one breaks the day /opt/greener moves.
# The project name is duplicated from app_stack rather than read from it — a role must not
# depend on another role's defaults being in scope (same rule as monitoring_app_compose_project).
backups_pg_compose_project: greener
backups_pg_compose_service: postgres

# --- Where it lands ------------------------------------------------------------------------
backups_dir: /var/backups/db-postgres/greener
backups_file_prefix: greener

# root:greener, and the leading 2 is the point: SETGID. Without it the dumps would be
# created by root and land in the root group no matter what the directory says, so the
# group would be decoration. With it, every new file inherits the greener group and the
# 027 umask below makes it 0640.
#
# Duplicated from the common role rather than read from it — a role must not depend on
# another role's defaults being in scope (same rule as monitoring_app_compose_project).
#
# ACCEPTED: every member of the greener group, sudo or not, can now read the encrypted
# dumps. They stay unreadable without the GPG passphrase, which remains 0600 root.
backups_dir_group: greener
backups_dir_mode: "2750"
# Files 0640: owner writes, greener group reads, nobody else. The metrics file is the one
# deliberate exception and is chmod'd back to 0644 by the script.
backups_umask: "027"

# Anything smaller than this is not a database, it is a truncated pipe. A PostGIS dump of an
# empty schema still compresses to a few KB, so this only ever catches the real failure.
backups_min_size_bytes: 1024

# --- Rotation ------------------------------------------------------------------------------
# 7 days at one dump every 3 h is ~56 dumps kept. The rotation runs only after a dump has
# succeeded, so a broken backup chain never erodes the history it can no longer replace.
# The off-site copy keeps a longer window (30 days) on purpose — see the rclone role.
backups_retention_days: 7

# --- Encryption ----------------------------------------------------------------------------
# Symmetric AES256. The passphrase is a vault_* value rendered here by Ansible; it is never
# typed onto the host. Losing BOTH this file and the vault means losing every backup, which
# is why the DRP keeps a copy outside the repo.
backups_gpg_passphrase_file: /etc/greener/backup_gpg_pass
# Its own GNUPGHOME: root's ~/.gnupg may not exist on a fresh host, and gpg needs somewhere
# to keep its random state even for a symmetric encryption that uses no keyring.
backups_gnupg_home: /var/lib/greener-backup/gnupg

# --- Script, units, state ------------------------------------------------------------------
backups_script: /usr/local/bin/greener-db-backup
backups_unit: greener-db-backup
backups_state_dir: /var/lib/greener-backup
backups_state_file: "{{ backups_state_dir }}/state"

# Every 3 hours on the clock (00:00, 03:00, …), so the dumps of two hosts line up and the
# filenames are predictable. Persistent: a host that was down through an occurrence catches
# up at boot instead of waiting for the next one.
backups_on_calendar: "*-*-* 00/3:00:00"
backups_persistent: true
# Also fires this long after each boot. Persistent= alone does NOT cover a fresh install:
# with no stamp file systemd has no missed occurrence to catch up on, so a newly enabled
# timer sits idle until the next slot — up to three hours with no backup and, worse, no
# metrics at all, which puts greener-backup-stale straight into its no-data alert. OnBootSec
# closes both: on a host booted long ago, starting the timer triggers at once.
backups_on_boot: 5min
# The dump reads the whole database; starting it at the exact same second as every other
# timer on the host is how a 3 a.m. load spike gets built.
backups_randomized_delay: 120

# --- Metrics -------------------------------------------------------------------------------
# Written where the node exporter's textfile collector reads. The path is duplicated from
# the monitoring role for the same reason as the compose project above; the two must agree,
# and monitoring's metrics probes are what catch it if they ever stop agreeing.
backups_textfile_dir: /opt/greener-monitoring/textfile
backups_textfile_file: "{{ backups_textfile_dir }}/db_backup.prom"

# --- Off-site replication (rclone → Google Drive) -------------------------------------------
backups_sync_enabled: true
backups_sync_script: /usr/local/bin/greener-db-sync
backups_sync_unit: greener-db-sync
backups_sync_state_file: "{{ backups_state_dir }}/sync-state"
backups_sync_textfile_file: "{{ backups_textfile_dir }}/db_backup_sync.prom"

# rclone from APT rather than the upstream install script: the distro package is older, but
# copy/check/delete --min-age have been stable for years, and it saves piping a remote script
# into a shell as root on the only host we have.
backups_rclone_packages:
  - rclone
backups_rclone_config: /etc/greener/rclone.conf
backups_rclone_remote_name: gdrive
backups_rclone_remote_path: Greener/Backups/postgres
backups_sync_retries: 3

# 30 days off-site against 7 on disk. That gap is the entire reason the sync script uses
# `rclone copy` and never `sync`: a mirror would replay the local rotation's deletions onto
# Drive and collapse the window back to 7 days. A corruption noticed after a fortnight is only
# recoverable if the two copies do not forget at the same time.
backups_drive_retention_days: 30

# Every 3 hours like the dump, offset by 20 minutes so it copies a finished file.
backups_sync_on_calendar: "*-*-* 00/3:20:00"
backups_sync_offset_note: "20 minutes"
backups_sync_on_boot: 10min

[defaults]
# No default inventory: environment must always be explicit via -i (see Makefile),
# so no ad-hoc command can hit an env — especially prod — by accident.
# inventory =    (intentionally unset)
roles_path = roles

result_format = yaml

# Vault passphrase lives OUTSIDE the repo (gitignored). This file only holds its path.
vault_password_file = ~/.config/greener/vault_pass

# Left at default True: access is VPN-only and hosts are stable, so we reject silent
# TOFU. Enable only for the very first provisioning of a throwaway host.
# host_key_checking = False

retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent
force_color = True

[privilege_escalation]
# become by default so roles run as root without repeating `become:` everywhere.
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
# pipelining: one SSH channel, no temp files — big speedup. Needs requiretty off (default).
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

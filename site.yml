---
# Pure orchestrator: maps host groups to roles, in order. No inline tasks, no logic.

# common runs FIRST on every host. It creates the named accounts and deploys their
# public keys — MUST happen before the ssh role hardens sshd, otherwise a fresh VPS
# with PasswordAuthentication/PermitRootLogin disabled would lock everyone out.
- name: Common baseline
  hosts: all
  roles:
    - common

# Order matters: docker (engine) → backend (.env) → app_stack (compose) → caddy (proxy).
- name: GREENER VPS services
  hosts: greener_vps
  roles:
    - docker
    - backend
    - app_stack
    - caddy
    - backups
    - firewall
    - monitoring
    - openvpn
    - ssh
